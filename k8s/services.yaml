# The nine application services. They all run the same image; SERVICE_PATH
# picks which server.js starts, exactly like docker-compose.yml.
#
# Every pod gets:
#   - liveness  /health        -> restart the container if the process hangs
#   - readiness /health/ready  -> only send traffic once Postgres/Redis/Kafka are reachable
#   - prometheus.io/* annotations so Prometheus finds /metrics on its own
#   - CPU/memory requests (for scheduling and the HPA) and a memory limit
---
# The only service reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
    spec:
      containers:
        - name: api-gateway
          image: streaming-backend
          env:
            - { name: SERVICE_PATH, value: services/api-gateway/src/server.js }
          envFrom:
            - configMapRef: { name: streaming-config }
            - secretRef: { name: streaming-secrets }
          ports: [{ containerPort: 3000 }]
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }

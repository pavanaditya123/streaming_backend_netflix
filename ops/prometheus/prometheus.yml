# Prometheus config for the docker compose stack (`--profile observability`).
# Every service already exposes /metrics through the shared app factory,
# so all we do here is list them.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: streaming-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:3000
          - user-service:3001
          - catalog-service:3002
          - playback-service:3003
          - watch-history-service:3004
          - subscription-service:3005
          - billing-service:3006
          - notification-service:3007
          - recommendation-service:3008
    relabel_configs:
      # "catalog-service:3002" -> service="catalog-service", so alerts and
      # dashboards talk about services instead of host:port strings.
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: service

# Alertmanager groups alerts and forwards them to the incident-triage service
# (github.com/pavanaditya123/aiops-incident-triage), which turns them into
# tickets with a priority and a runbook attached.

route:
  receiver: incident-triage
  # One notification per alert name + service, not one per scrape target.
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: incident-triage
    webhook_configs:
      - url: http://incident-triage:8080/webhooks/alertmanager
        send_resolved: true

# A ServiceDown already explains every other alert from that service,
# so it silences them while it is firing.
inhibit_rules:
  - source_matchers: ['alertname = ServiceDown']
    target_matchers: ['severity = warning']
    equal: ['service']

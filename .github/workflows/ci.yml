name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # 1. Lint + the whole test suite, entirely in memory.
  #    No Postgres, no Redis, no Kafka — this is what the driver abstraction
  #    buys us, and it keeps the feedback loop under a minute.
  # ===========================================================================
  test:
    name: Lint and test (in-memory drivers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test:unit
        env:
          NODE_ENV: test

      - name: Full-platform end-to-end test
        run: npm run test:e2e
        env:
          NODE_ENV: test

      # Runs the real SQL against PGlite (Postgres compiled to WebAssembly), so
      # a broken query fails here in seconds rather than waiting for the
      # service-container job below.
      - name: SQL repository tests (embedded Postgres)
        run: npm run test:integration
        env:
          NODE_ENV: test

  # ===========================================================================
  # ML pipeline: unit tests on synthetic data, and a check that the model
  # artifact the recommendation-service ships matches the current catalog.
  # ===========================================================================
  ml:
    name: ML pipeline tests and artifact freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements.txt

      - name: Pipeline unit tests
        run: python -m pytest ml/tests -q

      - name: Model artifact is up to date with the catalog
        run: |
          python ml/build_catalog_model.py
          git diff --exit-code services/recommendation-service/src/domain/model/title-neighbors.json

  browser:
    name: Browser journeys (desktop and mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # ===========================================================================
  # 2. The same code against REAL Postgres and REAL Redis.
  #    Proves the SQL repositories and the Redis adapter actually work — the
  #    in-memory job above can never catch a broken query.
  # ===========================================================================
  integration:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: streaming
          POSTGRES_PASSWORD: streaming
          POSTGRES_DB: streaming
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U streaming -d streaming"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://streaming:streaming@localhost:5432/streaming
      REDIS_URL: redis://localhost:6379
      DATA_DRIVER: postgres
      CACHE_DRIVER: redis
      BUS_DRIVER: memory

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migrate

      - name: Migrations are idempotent (re-running is a no-op)
        run: npm run migrate

      - name: Seed the catalog
        run: node scripts/seed.js --titles=500

      - name: Repository tests against real Postgres and Redis
        run: npm run test:integration
        env:
          NODE_ENV: test
          # Refuse to silently fall back to the embedded engine: this job exists
          # precisely to prove the code works against a real server.
          REQUIRE_REAL_POSTGRES: '1'

  # ===========================================================================
  # 3. Boot the whole platform and drive it like a real client.
  #    This is the job that answers "does it actually work end to end?".
  # ===========================================================================
  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the platform
        run: |
          node scripts/dev-all.js > /tmp/platform.log 2>&1 &
          echo "PLATFORM_PID=$!" >> $GITHUB_ENV

      - name: Wait for the gateway to be ready
        run: node scripts/wait-for.js http://localhost:3000/ops/services --timeout=60000

      - name: Run the end-to-end walkthrough
        run: npm run smoke

      - name: Benchmark cached vs uncached
        run: node scripts/bench.js --requests=200 --concurrency=20

      - name: Platform logs
        if: always()
        run: tail -100 /tmp/platform.log

  # ===========================================================================
  # 4. The Docker image and compose file must stay valid.
  # ===========================================================================
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      # The default `docker` driver cannot export a build cache, so
      # `cache-to: type=gha` below fails without a docker-container builder.
      - uses: docker/setup-buildx-action@v3

      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: streaming-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image boots and answers a health check
        run: |
          docker run -d --name gw -p 3000:3000 \
            -e SERVICE_PATH=services/api-gateway/src/server.js \
            -e DATA_DRIVER=memory -e CACHE_DRIVER=memory -e BUS_DRIVER=memory \
            streaming-backend:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "gateway is healthy"; docker logs gw; exit 0
            fi
            sleep 2
          done
          echo "gateway never became healthy"; docker logs gw; exit 1

  # ===========================================================================
  # 5. Ops config: alert rules, Kubernetes manifests and Terraform are code
  #    too, so they get checked on every push like the rest.
  # ===========================================================================
  ops-checks:
    name: Alert rules, manifests, Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Alert rules are valid and their unit tests pass
        run: |
          docker run --rm -v "$PWD/ops/prometheus:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/ops/prometheus:/rules" -w /rules --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules alerts.test.yml

      - name: Kubernetes manifests match the API schema
        run: |
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl kustomize k8s > rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary /work/rendered.yaml

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform is formatted and valid
        working-directory: infra/aws
        run: |
          terraform fmt -check -diff
          terraform init -backend=false -input=false
          terraform validate

  # ===========================================================================
  # 6. Deploy the real manifests to a throwaway Kubernetes cluster (kind),
  #    wait for every pod to become ready, then run the same smoke test
  #    against it. If the YAML deploys here, it deploys on the AWS box.
  # ===========================================================================
  kubernetes:
    name: Deploy to kind and smoke test
    runs-on: ubuntu-latest
    needs: [test, docker]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: helm/kind-action@v1
        with:
          cluster_name: streaming

      - name: Build the image and load it into kind
        run: |
          docker build -t streaming-backend:ci .
          kind load docker-image streaming-backend:ci --name streaming

      - name: Point the manifests at the local image and deploy
        run: |
          sed -i 's|newName: .*|newName: streaming-backend|; s|newTag: .*|newTag: ci|' k8s/kustomization.yaml
          cp k8s/secrets.env.example k8s/secrets.env
          kubectl apply -k k8s

      - name: Wait for infra, migrations, then every service
        run: |
          kubectl -n streaming rollout status statefulset/postgres --timeout=180s
          kubectl -n streaming rollout status statefulset/kafka --timeout=300s
          kubectl -n streaming wait --for=condition=complete job/migrate --timeout=300s
          for d in $(kubectl -n streaming get deploy -o name); do
            kubectl -n streaming rollout status "$d" --timeout=300s
          done

      - name: Smoke test through the gateway
        run: |
          kubectl -n streaming port-forward svc/api-gateway 3000:3000 > /tmp/pf.log 2>&1 &
          node scripts/wait-for.js http://localhost:3000/ops/services --timeout=60000
          npm run smoke

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n streaming get pods -o wide
          kubectl -n streaming describe pods | tail -80
          kubectl -n streaming logs job/migrate --tail=50 || true
          kubectl -n streaming logs statefulset/kafka --tail=50 || true

  # ===========================================================================
  # 7. On main only: publish the image the Kubernetes manifests deploy.
  # ===========================================================================
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [kubernetes, integration, ops-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/streaming-backend:latest
            ghcr.io/${{ github.repository_owner }}/streaming-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =============================================================================
# Full stack: real Postgres, real Redis, real Kafka, nine service containers.
#
#   docker compose up --build
#   docker compose run --rm migrate      # apply schema + seed (runs automatically)
#   npm run smoke                        # drive the running stack
#
# Every service is configured with DATA_DRIVER=postgres, CACHE_DRIVER=redis and
# BUS_DRIVER=kafka, which is the ONLY difference from `npm run dev`.
# =============================================================================

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &service-env
    NODE_ENV: production
    LOG_LEVEL: info
    DATA_DRIVER: postgres
    CACHE_DRIVER: redis
    BUS_DRIVER: kafka
    DATABASE_URL: postgres://streaming:streaming@postgres:5432/streaming
    REDIS_URL: redis://redis:6379
    KAFKA_BROKERS: kafka:9092
    JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
    INTERNAL_SECRET: ${INTERNAL_SECRET:-dev-only-internal-secret}
    USER_SERVICE_URL: http://user-service:3001
    CATALOG_SERVICE_URL: http://catalog-service:3002
    PLAYBACK_SERVICE_URL: http://playback-service:3003
    WATCH_HISTORY_SERVICE_URL: http://watch-history-service:3004
    SUBSCRIPTION_SERVICE_URL: http://subscription-service:3005
    BILLING_SERVICE_URL: http://billing-service:3006
    NOTIFICATION_SERVICE_URL: http://notification-service:3007
    RECOMMENDATION_SERVICE_URL: http://recommendation-service:3008
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  # ---- infrastructure -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
      POSTGRES_DB: streaming
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streaming -d streaming']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: ['6379:6379']
    volumes: ['redisdata:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode — no ZooKeeper needed.
  kafka:
    image: bitnami/kafka:3.7
    ports: ['9092:9092']
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Single broker in dev, so one replica is all that is possible.
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes: ['kafkadata:/bitnami/kafka']
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ---- one-shot schema + seed ----------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "node scripts/migrate.js && node scripts/seed.js --titles=2000"
    environment:
      <<: *service-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  # ---- application services -------------------------------------------------
  user-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/user-service/src/server.js
    ports: ['3001:3001']

  catalog-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/catalog-service/src/server.js
    ports: ['3002:3002']

  playback-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/playback-service/src/server.js
    ports: ['3003:3003']

  watch-history-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/watch-history-service/src/server.js
    ports: ['3004:3004']

  subscription-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/subscription-service/src/server.js
    ports: ['3005:3005']

  billing-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/billing-service/src/server.js
    ports: ['3006:3006']

  notification-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/notification-service/src/server.js
    ports: ['3007:3007']

  recommendation-service:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/recommendation-service/src/server.js
    ports: ['3008:3008']

  api-gateway:
    <<: *service-base
    environment:
      <<: *service-env
      SERVICE_PATH: services/api-gateway/src/server.js
    ports: ['3000:3000']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  kafkadata:
